name: daily-collect

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 08:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 공고 수집
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python3 collect.py --days 2

      - name: 수집 무결성 검사 (소스 오류 시 배포 중단)
        run: |
          python3 - << 'EOF'
          import json, sys
          errs = json.load(open("new_items.json"))["errors"]
          if errs:
              print("소스 오류로 배포 중단:", errs)
              sys.exit(1)
          EOF

      - name: 커밋 및 배포
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "자동 수집: $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
