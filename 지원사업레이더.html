<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📡 김매실 지원사업 레이더</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e5e8ec;
    --ink: #1c2330; --sub: #6b7686; --accent: #2f6fed;
    --biz: #2f6fed; --kst: #16a34a; --g2b: #ea850c;
    --gok: #9333ea; --sms: #0d9488; --bojo: #db2777; --iris: #4f46e5;
    --catBid: #ea850c; --catFund: #16a34a; --catBen: #7c3aed;
    --danger: #dc2626; --warn: #d97706;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif;
         background: var(--bg); color: var(--ink); line-height: 1.5; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  header h1 { font-size: 24px; }
  header .meta { color: var(--sub); font-size: 13px; }

  /* 요약 카드 */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 18px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { font-size: 24px; display: block; }
  .stat span { color: var(--sub); font-size: 13px; }

  /* 컨트롤 */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 22px; }
  .controls input[type=search] { flex: 1; min-width: 220px; padding: 9px 14px; border: 1px solid var(--line);
    border-radius: 10px; font-size: 14px; background: var(--card); }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--sub); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  label.toggle { font-size: 13px; color: var(--sub); display: flex; gap: 5px; align-items: center; cursor: pointer; }

  /* 섹션 */
  section { margin-bottom: 34px; }
  section > h2 { font-size: 17px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  section > h2 .count { font-size: 12px; color: var(--sub); font-weight: 500; }

  /* 캘린더 */
  .cal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cal-head b { font-size: 16px; }
  .cal-head button { border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 4px 12px; cursor: pointer; font-size: 14px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-grid .dow { text-align: center; font-size: 11px; color: var(--sub); padding: 4px 0; }
  .cal-cell { min-height: 56px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px;
    font-size: 11px; background: #fcfcfd; overflow: hidden; }
  .cal-cell.has { cursor: pointer; }
  .cal-cell.has:hover { border-color: var(--accent); background: #f0f5ff; }
  .cal-cell.other { opacity: .35; }
  .cal-cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cal-cell.sel { background: var(--accent); border-color: var(--accent); }
  .cal-cell.sel .d, .cal-cell.sel .cnt { color: #fff; }
  .cal-cell.sel .cnt { background: rgba(255,255,255,.25); }
  .cal-cell .d { font-weight: 600; font-size: 11px; color: var(--sub); display: block; }
  .cal-cell .cnt { display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 999px;
    background: #e8eefb; color: var(--accent); font-weight: 700; font-size: 12px; }
  .cal-hint { color: var(--sub); font-size: 12px; margin-top: 8px; }
  .flabel { font-size: 12px; color: var(--sub); font-weight: 700; margin-right: 2px; }

  /* 지역 지도 */
  .map-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  .map-main { flex: 0 1 440px; min-width: 260px; }
  #mapSubWrap[hidden] { display: none; }
  .map-wrap.drill #mapNationWrap { display: none; }
  @media (min-width: 900px) {
    .map-wrap.drill #mapNationWrap { display: block; }
  }
  #mapCrumb { margin-bottom: 8px; display: flex; align-items: center; }
  .map-muni { fill: #fff; stroke: #c9d1da; stroke-width: .8; cursor: pointer; transition: fill .15s; }
  .map-muni:hover { stroke: var(--accent); stroke-width: 1.4; }
  .map-muni.sel { stroke: var(--ink); stroke-width: 1.8; }
  .map-muni.zero { fill: #f3f4f6; cursor: default; }
  .map-region { fill: #fff; stroke: #c9d1da; stroke-width: 1; cursor: pointer; transition: fill .15s; }
  .map-region:hover { stroke: var(--accent); stroke-width: 1.6; }
  .map-region.sel { stroke: var(--ink); stroke-width: 2; }
  .map-region.zero { cursor: default; fill: #f3f4f6; }
  .map-label { pointer-events: none; }
  .map-label text { text-anchor: middle; font-family: inherit; }
  .map-label .rname { font-size: 11.5px; font-weight: 700; fill: var(--ink); }
  .map-label .rcnt { font-size: 10px; fill: var(--sub); }
  .map-label.dark .rname { fill: #fff; }
  .map-label.dark .rcnt { fill: rgba(255,255,255,.85); }
  .map-tile { border: 1px solid var(--line); border-radius: 9px; cursor: pointer; padding: 6px 7px;
    background: #fff; display: flex; flex-direction: column; justify-content: space-between;
    font-size: 12px; font-weight: 700; width: 130px; height: 56px; }
  .map-tile:hover { border-color: var(--accent); }
  .map-tile .cnt2 { font-weight: 400; font-size: 12px; color: var(--sub); }
  .map-tile.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
  .map-tile.zero { opacity: .45; cursor: default; }
  .map-side { display: flex; flex-direction: column; gap: 5px; }

  /* 접수기간 타임라인 */
  .tl-leg { font-size: 12px; color: var(--sub); font-weight: 500; display: inline-flex;
    align-items: center; gap: 4px; margin-left: 6px; }
  .tl-leg i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .tl-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .tl-row { display: grid; grid-template-columns: minmax(180px, 300px) 1fr 92px; gap: 10px;
    align-items: center; padding: 4px 0; border-bottom: 1px solid #f1f3f6; }
  .tl-row:last-of-type { border-bottom: none; }
  .tl-title { font-size: 12.5px; font-weight: 600; color: var(--ink); text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-title:hover { color: var(--accent); }
  .tl-track { position: relative; height: 16px; background: #f6f8fb; border-radius: 5px; overflow: hidden; }
  .tl-today { position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--danger); opacity: .65; }
  .tl-bar { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; min-width: 5px; opacity: .9; }
  .tl-bar.clipR { border-top-right-radius: 0; border-bottom-right-radius: 0;
    -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
  .tl-dates { font-size: 11px; color: var(--sub); text-align: right; white-space: nowrap; }
  .tl-axis-row { display: grid; grid-template-columns: minmax(180px, 300px) 1fr 92px; gap: 10px; margin-bottom: 6px; }
  .tl-axis { position: relative; height: 16px; }
  .tl-axis span { position: absolute; font-size: 10px; color: var(--sub); transform: translateX(-50%); }
  .tl-axis .tick { position: absolute; top: 13px; bottom: -3px; width: 1px; background: var(--line); }
  @media (max-width: 640px) {
    .tl-row, .tl-axis-row { grid-template-columns: minmax(120px, 160px) 1fr; }
    .tl-dates { display: none; }
  }

  /* 페이지네이션 */
  .pager { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 10px 2px 2px; }
  .pager .pg { min-width: 30px; padding: 5px 8px; border: 1px solid var(--line); background: var(--card);
    border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--sub); }
  .pager .pg.on { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }
  .pager .pg:disabled { opacity: .35; cursor: default; }
  .pg-dots { color: var(--sub); font-size: 12px; padding: 0 2px; }
  .pg-info { margin-left: auto; color: var(--sub); font-size: 12px; }
  .day-list { margin-top: 14px; }
  .day-list h3 { font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .day-list h3 .clear { border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 2px 10px; font-size: 12px; cursor: pointer; color: var(--sub); }

  /* 리스트 */
  .list { display: grid; gap: 8px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; }
  .item.done { opacity: .5; }
  .dday { font-weight: 700; font-size: 15px; text-align: center; }
  .dday small { display: block; font-weight: 400; font-size: 11px; color: var(--sub); }
  .dday.hot { color: var(--danger); } .dday.soon { color: var(--warn); }
  .item .t { font-size: 14px; font-weight: 600; text-decoration: none; color: var(--ink); }
  .item .t:hover { color: var(--accent); }
  .item .s { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; color: #fff; margin-right: 6px; }
  .badge.기업마당 { background: var(--biz); } .badge.KStartup { background: var(--kst); }
  .badge.나라장터 { background: var(--g2b); }
  .badge.예술경영지원센터 { background: var(--gok); } .badge.소상공인시장진흥공단 { background: var(--sms); }
  .badge.e나라도움 { background: var(--bojo); } .badge.IRIS { background: var(--iris); }
  .item select { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12px;
    background: #fff; cursor: pointer; }
  .acts { display: flex; gap: 5px; align-items: center; }
  .note-btn { border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 4px 7px; cursor: pointer; font-size: 13px; opacity: .55; }
  .note-btn.has { opacity: 1; border-color: #d9b23a; background: #fdf6df; }
  .note-view { font-size: 12px; color: #8a6d1a; background: #fdf6df; border-radius: 6px;
    padding: 3px 8px; margin-top: 5px; display: inline-block; white-space: pre-wrap; }
  .note-edit { grid-column: 1 / -1; border: 1px solid #d9b23a; border-radius: 8px;
    padding: 8px 10px; font-size: 13px; font-family: inherit; min-height: 52px; resize: vertical; }
  .item select.st-검토중 { border-color: var(--accent); color: var(--accent); }
  .item select.st-신청함 { border-color: var(--kst); color: var(--kst); }
  .empty { color: var(--sub); font-size: 14px; padding: 18px; text-align: center;
    background: var(--card); border: 1px dashed var(--line); border-radius: 12px; }

  /* 그룹 (분야별/주차별 등) */
  details.grp { margin-bottom: 6px; }
  details.grp > summary { cursor: pointer; font-size: 15px; font-weight: 700; padding: 10px 6px;
    list-style: none; display: flex; align-items: center; gap: 8px; border-radius: 8px; }
  details.grp > summary::-webkit-details-marker { display: none; }
  details.grp > summary::before { content: "▸"; color: var(--sub); font-size: 12px; transition: transform .15s; }
  details.grp[open] > summary::before { transform: rotate(90deg); }
  details.grp > summary:hover { background: #eef1f5; }
  details.grp > summary .count { font-size: 12px; color: var(--sub); font-weight: 500; }
  details.grp .list { margin: 4px 0 16px; }
  @media (max-width: 640px) {
    .item { grid-template-columns: 52px 1fr; }
    .item select { grid-column: 2; justify-self: start; }
    .cal-cell { min-height: 46px; }
    .cal-cell .cnt { padding: 0 6px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📡 지원사업 레이더</h1>
    <span class="meta" id="meta"></span>
  </header>
  <div class="meta" id="errors" style="color:var(--danger)"></div>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <input type="search" id="q" placeholder="공고명·기관·분야 검색…">
    <button class="chip on" data-src="전체">전체</button>
    <button class="chip" data-src="기업마당">기업마당</button>
    <button class="chip" data-src="K-Startup">K-Startup</button>
    <button class="chip" data-src="나라장터">나라장터</button>
    <button class="chip" data-src="예술경영지원센터">예술경영</button>
    <button class="chip" data-src="소상공인시장진흥공단">소진공</button>
    <button class="chip" data-src="e나라도움">e나라도움</button>
    <button class="chip" data-src="IRIS">IRIS</button>
    <select id="regionSel" class="chip" title="지역 필터"></select>
    <label class="toggle"><input type="checkbox" id="hideDone" checked> 제외한 공고 숨기기</label>
  </div>

  <section>
    <h2>📅 공고 캘린더 <span class="count">공고일(레이더 수집일) 기준</span></h2>
    <div class="cal">
      <div class="cal-head">
        <button id="prev">‹</button><b id="calTitle"></b><button id="next">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-hint" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span id="calHint">날짜를 클릭하면 그날 올라온 공고만 아래에 표시됩니다.</span>
        <button class="chip" id="alwaysBtn"></button>
      </div>
      <div class="day-list" id="dayList" style="display:none">
        <h3><span id="dayTitle"></span><button class="clear" id="dayClear">선택 해제 ✕</button></h3>
        <div id="dayFilters"></div>
        <div class="list" id="dayItems"></div>
      </div>
    </div>
  </section>

  <section>
    <h2>🗺 지역별 현황 <span class="count">타일을 클릭하면 그 지역만 표시됩니다</span></h2>
    <div class="map-wrap">

6.5,181.8 201.7,172.8 259.2,165.4Z","cx":225.6,"cy":180.8},{"n":"종로구","k":"종로","d":"M206.9,87.9 210.2,89.1 222.0,110.4 226.8,140.3 259.0,157.3 259.2,165.4 201.7,172.8 188.4,156.2 185.2,119.1 187.0,97.5 206.9,87.9Z","cx":213.9,"cy":125.8}]}};</script>
<script>
const DATA = window.RADAR_DATA || { items: [], collected_at: "-", errors: ["data.js 없음 — collect.py를 먼저 실행하세요"] };
const STATUS_KEY = "radar-status";
const statuses = JSON.parse(localStorage.getItem(STATUS_KEY) || "{}");
const today = new Date(); today.setHours(0,0,0,0);
const iso = d => d.toISOString().slice(0,10);
const TODAY = iso(new Date(today.getTime() - today.getTimezoneOffset()*60000));

let srcFilter = "전체", query = "", hideDone = true, groupMode = "source", regionFilter = "전체";
let calY = today.getFullYear(), calM = today.getMonth();
let selDate = null, dayRegion = "전체", dayField = "전체", subRegion = "전체";

function dday(deadline) {
  if (!deadline) return null;
  return Math.round((new Date(deadline) - new Date(TODAY)) / 86400000);
}
function visible(i, skipRegion) {
  if (srcFilter !== "전체" && i.source !== srcFilter) return false;
  if (!skipRegion && regionFilter !== "전체" && regionOf(i) !== regionFilter) return false;
  if (!skipRegion && subRegion !== "전체" && window.MUNI_MAPS && MUNI_MAPS[regionFilter]) {
    const blob = i.title + " " + (i.org || "");
    const keys = MUNI_MAPS[regionFilter].regions.map(r => r.k);
    if (subRegion === "미상") { if (keys.some(k => blob.includes(k))) return false; }
    else if (!blob.includes(subRegion)) return false;
  }
  if (hideDone && statuses[i.id] === "제외") return false;
  if (query && !(i.title + i.org + i.field + (i.target||"")).toLowerCase().includes(query)) return false;
  const d = dday(i.deadline);
  return d === null || d >= 0;
}
function srcClass(s) { return s.replace("-", ""); }

const NOTES_KEY = "radar-notes";
const notes = JSON.parse(localStorage.getItem(NOTES_KEY) || "{}");
const escNote = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function itemHTML(i) {
  const d = dday(i.deadline);
  const st = statuses[i.id] || "신규";
  const ddClass = d !== null && d <= 3 ? "hot" : d !== null && d <= 7 ? "soon" : "";
  const note = i.deadline_note || "";
  const memo = notes[i.id] || "";
  const ddText = d !== null ? (d === 0 ? "D-DAY" : "D-" + d)
    : note.includes("예산") ? "예산소진" : note.includes("수시") ? "수시"
    : note.includes("선착순") ? "선착순" : "상시";
  return `<div class="item ${st === "제외" ? "done" : ""}">
    <div class="dday ${ddClass}">${ddText}<small>${i.deadline || note}</small></div>
    <div>
      <a class="t" href="${i.url}" target="_blank">${i.title}</a>
      <div class="s"><span class="badge ${srcClass(i.source)}">${i.source}</span>${i.org || ""} · ${i.field || ""}${i.target ? " · " + i.target : ""}</div>
      ${memo ? `<div class="note-view">📝 ${escNote(memo)}</div>` : ""}
    </div>
    <div class="acts">
      <select class="st-${st}" onchange="setStatus('${i.id}', this.value)">
        ${["신규","검토중","신청함","제외"].map(s => `<option ${s === st ? "selected" : ""}>${s}</option>`).join("")}
      </select>
      <button class="note-btn ${memo ? "has" : ""}" data-id="${i.id}" title="메모">📝</button>
    </div>
  </div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest(".note-btn");
  if (!b) return;
  const item = b.closest(".item");
  if (item.querySelector(".note-edit")) return;
  const ta = document.createElement("textarea");
  ta.className = "note-edit";
  ta.value = notes[b.dataset.id] || "";
  ta.placeholder = "이 공고에 대한 메모… (칸 밖을 클릭하면 저장)";
  item.appendChild(ta);
  ta.focus();
  ta.onblur = () => {
    const v = ta.value.trim();
    if (v) notes[b.dataset.id] = v; else delete notes[b.dataset.id];
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
    render();
  };
});
function setStatus(id, v) {
  statuses[id] = v;
  localStorage.setItem(STATUS_KEY, JSON.stringify(statuses));
  render();
}

function renderCalendar(items) {
  const first = new Date(calY, calM, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const byDay = {};
  // 공고일 기준: 접수시작일이 있으면 그 날, 없으면 레이더가 처음 발견한 날
  items.forEach(i => { const d = i.start || i.first_seen; if (d) (byDay[d] = byDay[d] || []).push(i); });
  document.getElementById("calTitle").textContent = `${calY}년 ${calM + 1}월`;
  let html = ["일","월","화","수","목","금","토"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let w = 0; w < 6; w++) for (let dd = 0; dd < 7; dd++) {
    const cur = new Date(start); cur.setDate(start.getDate() + w*7 + dd);
    const key = iso(new Date(cur.getTime() - cur.getTimezoneOffset()*60000));
    const evs = byDay[key] || [];
    const cls = (cur.getMonth() !== calM ? "other " : "") + (key === TODAY ? "today " : "")
      + (evs.length ? "has " : "") + (key === selDate ? "sel" : "");
    html += `<div class="cal-cell ${cls}" ${evs.length ? `data-date="${key}"` : ""}>`
      + `<span class="d">${cur.getDate()}</span>`
      + (evs.length ? `<span class="cnt">${evs.length}건</span>` : "") + `</div>`;
  }
  document.getElementById("calGrid").innerHTML = html;
  document.querySelectorAll(".cal-cell[data-date]").forEach(c => c.onclick = () => {
    const wasNew = selDate !== c.dataset.date;
    selDate = wasNew ? c.dataset.date : null;
    dayRegion = dayField = "전체"; resetPages();
    render();
    if (wasNew) document.getElementById("dayList").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  const always = items.filter(i => !i.deadline);
  const btn = document.getElementById("alwaysBtn");
  btn.textContent = `🗓 상시·마감미정 ${always.length}건`;
  btn.classList.toggle("on", selDate === "상시");
  btn.onclick = () => { selDate = selDate === "상시" ? null : "상시"; dayRegion = dayField = "전체"; resetPages(); render();
    if (selDate) document.getElementById("dayList").scrollIntoView({ behavior: "smooth", block: "start" }); };

  const dayList = document.getElementById("dayList");
  const hint = document.getElementById("calHint");
  if (selDate) {
    const base = selDate === "상시" ? always : (byDay[selDate] || []);
    const title = selDate === "상시" ? "상시·마감미정 공고"
      : `${+selDate.split("-")[1]}월 ${+selDate.split("-")[2]}일 올라온 공고`;

    // 반대쪽 필터를 적용한 상태에서 각 칩의 건수를 센다 (교차 필터)
    const rc = {}, fc = {};
    base.forEach(i => {
      if (dayField === "전체" || normField(i) === dayField)
        rc[regionOf(i)] = (rc[regionOf(i)] || 0) + 1;
      if (dayRegion === "전체" || regionOf(i) === dayRegion)
        fc[normField(i)] = (fc[normField(i)] || 0) + 1;
    });
    const esc = s => String(s).replace(/"/g, "&quot;");
    const chip = (k, v, label, on) =>
      `<button class="chip ${on ? "on" : ""}" data-k="${k}" data-v="${esc(v)}">${label}</button>`;
    const rTotal = Object.values(rc).reduce((a, b) => a + b, 0);
    const fTotal = Object.values(fc).reduce((a, b) => a + b, 0);
    const regions = Object.keys(rc).sort((a, b) => a === "전국" ? -1 : b === "전국" ? 1 : rc[b] - rc[a]);
    const fields = Object.keys(fc).sort((a, b) => fc[b] - fc[a]);
    document.getElementById("dayFilters").innerHTML =
      `<div class="controls" style="margin:0 0 6px"><span class="flabel">📍 지역</span>`
      + chip("r", "전체", `전체 ${rTotal}`, dayRegion === "전체")
      + regions.map(r => chip("r", r, `${r} ${rc[r]}`, dayRegion === r)).join("") + `</div>`
      + `<div class="controls" style="margin:0 0 12px"><span class="flabel">📂 분야</span>`
      + chip("f", "전체", `전체 ${fTotal}`, dayField === "전체")
      + fields.map(f => chip("f", f, `${f} ${fc[f]}`, dayField === f)).join("") + `</div>`;

    const evs = base.filter(i =>
      (dayRegion === "전체" || regionOf(i) === dayRegion) &&
      (dayField === "전체" || normField(i) === dayField));
    document.getElementById("dayTitle").textContent = `${title} (${evs.length}건)`;
    document.getElementById("dayItems").innerHTML = pagedList(evs, "day");
    dayList.style.display = "";
    hint.style.display = "none";
  } else {
    dayList.style.display = "none";
    hint.style.display = "";
  }
}

// ── 페이지네이션 ──
const PER_PAGE = 15;
let pageState = {};
function resetPages() { pageState = {}; }
function pagedList(list, key, renderer) {
  renderer = renderer || itemHTML;
  if (!list.length) return `<div class="empty">해당 공고가 없습니다</div>`;
  const pages = Math.ceil(list.length / PER_PAGE);
  const cur = Math.min(pageState[key] || 0, pages - 1);
  const slice = list.slice(cur * PER_PAGE, (cur + 1) * PER_PAGE);
  let pager = "";
  if (pages > 1) {
    const win = 7, half = Math.floor(win / 2);
    let s = Math.max(0, Math.min(cur - half, pages - win));
    let e = Math.min(pages, s + win);
    const btn = (n, label, on, dis) =>
      `<button class="pg ${on ? "on" : ""}" ${dis ? "disabled" : ""} data-pg-key="${key}" data-pg-n="${n}">${label}</button>`;
    pager = `<div class="pager">`
      + btn(cur - 1, "‹", false, cur === 0)
      + (s > 0 ? btn(0, "1", false) + `<span class="pg-dots">…</span>` : "")
      + Array.from({length: e - s}, (_, k) => btn(s + k, s + k + 1, s + k === cur)).join("")
      + (e < pages ? `<span class="pg-dots">…</span>` + btn(pages - 1, pages, false) : "")
      + btn(cur + 1, "›", false, cur === pages - 1)
      + `<span class="pg-info">${cur * PER_PAGE + 1}–${Math.min(list.length, (cur + 1) * PER_PAGE)} / ${list.length}건</span></div>`;
  }
  return slice.map(renderer).join("") + pager;
}
document.addEventListener("click", e => {
  const b = e.target.closest("button.pg");
  if (!b || b.disabled) return;
  pageState[b.dataset.pgKey] = +b.dataset.pgN;
  render();
});

function render() {
  const items = DATA.items.filter(i => visible(i));
  document.getElementById("meta").textContent = `마지막 수집: ${DATA.collected_at} · 활성 공고 ${DATA.items.length}건`;
  document.getElementById("errors").textContent = (DATA.errors || []).join(" / ");

  const hot = items.filter(i => { const d = dday(i.deadline); return d !== null && d <= 7; });
  const applied = DATA.items.filter(i => statuses[i.id] === "신청함").length;
  const reviewing = DATA.items.filter(i => statuses[i.id] === "검토중").length;
  document.getElementById("stats").innerHTML = [
    [items.length, "표시 중인 공고"], [hot.length, "7일 내 마감"],

  ].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");

  renderCalendar(items);

  document.getElementById("hotList").innerHTML = pagedList(hot, "hot");

  // 다시 그리기 전에 현재 열려있는 그룹을 기억해 상태 유지
  const groupsEl = document.getElementById("groups");
  const openNow = new Set([...groupsEl.querySelectorAll("details.grp[open] > summary")]
    .map(s => s.dataset.label));
  const firstDraw = !groupsEl.querySelector("details.grp");
  const groups = buildGroups(items);
  groupsEl.innerHTML = groups.length
    ? groups.map((g, gi) => `<details class="grp" ${(firstDraw ? gi < 8 : openNow.has(g.label)) ? "open" : ""}>
        <summary data-label="${g.label.replace(/"/g, "&quot;")}">${g.label} <span class="count">${g.items.length}건</span></summary>
        <div class="list">${pagedList(g.items, "grp:" + g.label)}</div>
      </details>`).join("")
    : `<div class="empty">공고가 없습니다</div>`;
  document.getElementById("cAll").textContent = `(${items.length}건)`;
  renderMap(items);
  renderTimeline(items);
  syncURL();
}

// ── 지역 지도 (지역 필터를 제외한 현재 필터 기준 건수, 연두색 농도) ──
const LIME = a => `rgba(124,193,67,${a.toFixed(2)})`;  // 김매실 연두
function renderMap() {
  const base = DATA.items.filter(i => visible(i, true));
  const prov = window.MUNI_MAPS && MUNI_MAPS[regionFilter] ? regionFilter : null;
  // PC: 전국+시군구 나란히 / 모바일: .drill 클래스로 전국을 숨기고 전환
  document.querySelector(".map-wrap").classList.toggle("drill", !!prov);
  document.getElementById("mapSubWrap").hidden = !prov;

  // 전국 지도는 항상 갱신 (PC에서는 드릴다운 중에도 보인다)
  const counts = {};
  base.forEach(i => { const r = regionOf(i); counts[r] = (counts[r] || 0) + 1; });
  const regions = [...document.querySelectorAll("#mapSvg .map-region")];
  const max = Math.max(1, ...regions.map(p => counts[p.dataset.region] || 0));
  regions.forEach(p => {
    const r = p.dataset.region, n = counts[r] || 0;
    p.style.fill = n ? LIME(0.15 + 0.7 * (n / max)) : "";
    p.classList.toggle("zero", !n);
    p.classList.toggle("sel", regionFilter === r);
    const label = document.querySelector(`#mapSvg .map-label[data-region="${r}"]`);
    label.querySelector(".rcnt").textContent = n ? `${n}건` : "";
  });

  if (prov) {
    document.getElementById("mapCrumb").innerHTML =
      `<button class="chip" id="mapBack">← 전국 지도</button> <b style="font-size:13px;margin-left:6px">${prov} 시·군·구별</b>`;
    document.getElementById("mapBack").onclick = () => {
      regionFilter = subRegion = "전체";
      document.getElementById("regionSel").value = "전체";
      resetPages(); render();
    };
    renderSubMap(prov, base);
    return;
  }
  const n = counts["전국"] || 0;
  document.getElementById("mapSide").innerHTML =
    `<div style="font-size:12px;color:var(--sub);font-weight:700">지역 무관</div>
    <div class="map-tile ${regionFilter === "전국" ? "sel" : ""} ${n ? "" : "zero"}" data-region="전국"
      style="${n ? `background:${LIME(0.15 + 0.7 * Math.min(1, n / max))};` : ""}">
      <span>전국</span><span class="cnt2">${n}건</span></div>`;
}

// 선택한 시도의 시군구 드릴다운 지도
function renderSubMap(prov, base) {
  const m = MUNI_MAPS[prov];
  const inProv = base.filter(i => regionOf(i) === prov);
  const counts = {}; let unk = 0;
  inProv.forEach(i => {
    const blob = i.title + " " + (i.org || "");
    const hit = m.regions.find(r => blob.includes(r.k));
    if (hit) counts[hit.k] = (counts[hit.k] || 0) + 1; else unk++;
  });
  const max = Math.max(1, ...Object.values(counts));
  let paths = "", labels = "";
  m.regions.forEach(r => {
    const n = counts[r.k] || 0;
    const fill = n ? `style="fill:${LIME(0.15 + 0.7 * (n / max))}"` : "";
    paths += `<path class="map-muni ${subRegion === r.k ? "sel" : ""} ${n ? "" : "zero"}"
      data-sub="${r.k}" d="${r.d}" ${fill}><title>${r.n} ${n}건</title></path>`;
    if (n) labels += `<g class="map-label" transform="translate(${r.cx},${r.cy})">
      <text class="rname" y="-1">${r.n}</text><text class="rcnt" y="11">${n}건</text></g>`;
  });
  document.getElementById("mapSub").innerHTML =
    `<svg viewBox="0 0 ${m.w} ${m.h}" xmlns="http://www.w3.org/2000/svg"
      style="width:100%;max-width:440px;height:auto">${paths}${labels}</svg>`;
  document.getElementById("mapSide").innerHTML =
    `<div style="font-size:12px;color:var(--sub);font-weight:700">${prov} 전체·시군구 미상</div>
    <div class="map-tile ${subRegion === "미상" ? "sel" : ""} ${unk ? "" : "zero"}" data-sub="미상"
      style="${unk ? `background:${LIME(0.15 + 0.7 * Math.min(1, unk / Math.max(max, unk)))};` : ""}">
      <span>공통</span><span class="cnt2">${unk}건</span></div>
    <div style="font-size:11px;color:var(--sub);max-width:130px">시·군·구를 클릭하면 해당 지역 공고만 표시됩니다</div>`;
}
document.addEventListener("click", e => {
  const s = e.target.closest("[data-sub]");
  if (s) {
    if (s.classList.contains("zero")) return;
    subRegion = subRegion === s.dataset.sub ? "전체" : s.dataset.sub;

// ── 접수기간 타임라인 (시작일→마감일 막대, 혜택 유형별 색) ──
const FUND_RE = /자금|융자|보조금|지원금|바우처|보증|출연|이차보전|투자|펀딩|금융|대출|상환/;
function categoryOf(i) {
  if (i.source === "나라장터") return ["catBid", "입찰"];
  if (FUND_RE.test(i.title + (i.field || ""))) return ["catFund", "자금 지원"];
  return ["catBen", "인력·인프라 등 혜택"];
}
function tlRowHTML(win) {
  const [w0, w1] = win, span = w1 - w0;
  const fmt = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
  const todayPct = ((new Date(TODAY) - w0) / span * 100).toFixed(1);
  return i => {
    const s = new Date(i.start || i.first_seen || TODAY);
    const e = new Date(i.deadline);
    const left = Math.max(0, (s - w0) / span * 100);
    const right = Math.min(100, (e - w0) / span * 100 + 1);
    const [cat, catNm] = categoryOf(i);
    return `<div class="tl-row">
      <a class="tl-title" href="${i.url}" target="_blank" title="${i.title}">${i.title}</a>
      <div class="tl-track">
        <div class="tl-today" style="left:${todayPct}%"></div>
        <div class="tl-bar ${e > w1 ? "clipR" : ""}" style="left:${left.toFixed(1)}%;width:${(right - left).toFixed(1)}%;background:var(--${cat})"
          title="${catNm} · ${i.start ? fmt(i.start) : "?"}~${fmt(i.deadline)}"></div>
      </div>
      <span class="tl-dates">${i.start ? fmt(i.start) : ""}→${fmt(i.deadline)}</span>
    </div>`;
  };
}
function renderTimeline(items) {
  const tl = items.filter(i => i.deadline).sort((a, b) => a.deadline.localeCompare(b.deadline));
  document.getElementById("tlCount").textContent = `(${tl.length}건, 상시 제외 · 세로선 = 오늘)`;
  const w0 = new Date(TODAY); w0.setDate(w0.getDate() - 10);
  const w1 = new Date(TODAY); w1.setDate(w1.getDate() + 56);
  // 주 단위 눈금
  let axis = "";
  for (let d = new Date(w0); d <= w1; d.setDate(d.getDate() + 7)) {
    const pct = ((d - w0) / (w1 - w0) * 100).toFixed(1);
    axis += `<span style="left:${pct}%">${d.getMonth() + 1}/${d.getDate()}</span><div class="tick" style="left:${pct}%"></div>`;
  }
  document.getElementById("tlAxis").innerHTML =
    `<div class="tl-axis-row"><div></div><div class="tl-axis">${axis}</div><div></div></div>`;
  document.getElementById("tlList").innerHTML = pagedList(tl, "tl", tlRowHTML([w0, w1]));
}

// 현재 필터 상태를 URL에 반영 → 새로고침 유지·링크 공유 가능
function syncURL() {
  const p = new URLSearchParams();
  if (srcFilter !== "전체") p.set("src", srcFilter);
  if (regionFilter !== "전체") p.set("region", regionFilter);
  if (subRegion !== "전체") p.set("sub", subRegion);
  if (groupMode !== "source") p.set("g", groupMode);
  if (query) p.set("q", query);
  if (selDate) p.set("date", selDate);
  if (!hideDone) p.set("done", "1");
  const qs = p.toString();
  history.replaceState(null, "", qs ? "?" + qs : location.pathname);
}

// ── 그룹핑 ──
function weekInfo(deadline) {
  if (!deadline) return { idx: 9999, label: "🗓 상시·마감 미정" };
  const weekStart = new Date(TODAY);
  weekStart.setDate(weekStart.getDate() - weekStart.getDay()); // 일요일 시작
  const idx = Math.floor((new Date(deadline) - weekStart) / (7 * 86400000));
  const s = new Date(weekStart); s.setDate(weekStart.getDate() + idx * 7);
  const e = new Date(s); e.setDate(s.getDate() + 6);
  const fmt = x => `${x.getMonth() + 1}/${x.getDate()}`;
  const range = `${fmt(s)}–${fmt(e)}`;
  const name = idx === 0 ? "이번 주" : idx === 1 ? "다음 주" : `${idx}주 후`;
  return { idx, label: `⏰ ${name} (${range})` };
}
function normField(i) {
  if (i.source === "나라장터") return "입찰·용역";
  return (i.field || "").trim() || "기타";
}

// ── 지역 분류 (수집기가 넣은 region 우선, 없으면 공고명/기관명에서 추출) ──
const REGION_MAP = { "서울특별시":"서울","부산광역시":"부산","대구광역시":"대구","인천광역시":"인천",
  "광주광역시":"광주","대전광역시":"대전","울산광역시":"울산","세종특별자치시":"세종",
  "경기도":"경기","강원특별자치도":"강원","강원도":"강원","충청북도":"충북","충청남도":"충남",
  "전북특별자치도":"전북","전라북도":"전북","전라남도":"전남","경상북도":"경북","경상남도":"경남",
  "제주특별자치도":"제주","서울":"서울","부산":"부산","대구":"대구","인천":"인천","광주":"광주",
  "대전":"대전","울산":"울산","세종":"세종","경기":"경기","강원":"강원","충북":"충북","충남":"충남",
  "전북":"전북","전남":"전남","경북":"경북","경남":"경남","제주":"제주" };
const REGION_KEYS = Object.keys(REGION_MAP).sort((a, b) => b.length - a.length);
function regionOf(i) {
  if (i.region) return i.region;
  const m = (i.title || "").match(/^\s*[\[(（]([^\])）]{2,20})[\])）]/);
  if (m) for (const k of REGION_KEYS) if (m[1].includes(k)) return REGION_MAP[k];
  for (const k of REGION_KEYS) if ((i.org || "").includes(k)) return REGION_MAP[k];
  return "전국";
}

// ── 업종 분류 (공고명·분야·대상 키워드 기반) ──
const INDUSTRIES = [
  ["🎬 콘텐츠·미디어", ["콘텐츠","영상","방송","미디어","웹툰","게임","음악","공연","크리에이터","1인미디어","숏폼","릴스","유튜브","OTT","촬영","드라마","애니메이션"]],
  ["🛋 인테리어·건축", ["인테리어","건축","리모델링","시공","가구","조경","건설","공간디자인"]],
  ["🍽 식품·외식", ["식품","푸드","외식","농식품","요식","베이커리","먹거리","급식","레스토랑","김치","전통주"]],
  ["💄 패션·뷰티", ["패션","뷰티","화장품","의류","코스메틱","섬유","잡화","주얼리"]],
  ["🛒 이커머스·유통", ["이커머스","쇼핑몰","유통","판로","수출","무역","구매대행","라이브커머스","홈쇼핑","마켓","온라인 판매","해외판매","역직구","박람회","전시회"]],
  ["🤖 IT·AI·소프트웨어", ["AI","인공지능","소프트웨어","SW","플랫폼","앱 ","어플리케이션","디지털","데이터","블록체인","ICT","사이버","클라우드","메타버스"]],
  ["💊 바이오·헬스케어", ["바이오","헬스","의료","제약","건강기능","웰니스","의약"]],
  ["🏭 제조·하드웨어", ["제조","스마트공장","부품","소재","장비","기계","시제품","금형","공정"]],
  ["🏝 관광·문화", ["관광","문화","축제","전시","여행","한류","공예"]],
  ["🎓 교육 서비스", ["교육","이러닝","에듀","강의","연수","아카데미"]],
  ["🌱 농수산·환경·에너지", ["농업","수산","축산","환경","에너지","탄소","ESG","기후","친환경","해양"]],
];
function industryOf(i) {
  const blob = `${i.title} ${i.field} ${i.target || ""}`;
  for (const [label, kws] of INDUSTRIES)
    if (kws.some(k => blob.includes(k))) return label;
  return "🧩 공통·기타";
}
function buildGroups(items, mode) {
  mode = mode || groupMode;
  const map = new Map();
  const add = (label, order, i) => {
    if (!map.has(label)) map.set(label, { label, order, items: [] });
    map.get(label).items.push(i);
  };
  if (mode === "source") {
    const meta = { "기업마당": [0, "🏛 정부지원사업 (기업마당)"],
                   "K-Startup": [1, "🚀 창업지원 (K-Startup)"],
                   "나라장터": [2, "📋 공공조달 입찰 (나라장터)"],
                   "예술경영지원센터": [3, "🎭 예술경영지원센터 공모"],
                   "소상공인시장진흥공단": [4, "🏪 소상공인시장진흥공단"],
                   "e나라도움": [5, "🏦 국고·지방보조 공모 (e나라도움·보탬e)"],
                   "IRIS": [6, "🔬 R&D 사업공고 (IRIS)"] };
    items.forEach(i => { const m = meta[i.source] || [9, "📌 " + i.source]; add(m[1], m[0], i); });
  } else if (mode === "week") {
    items.forEach(i => { const w = weekInfo(i.deadline); add(w.label, w.idx, i); });
  } else if (mode === "region") {
    items.forEach(i => add("📍 " + regionOf(i), 0, i));
    map.forEach(g => g.order = g.label === "📍 전국" ? -1e9 : -g.items.length); // 전국 먼저
  } else if (mode === "industry") {
    items.forEach(i => add(industryOf(i), 0, i));
    map.forEach(g => g.order = g.label === "🧩 공통·기타" ? 1e9 : -g.items.length); // 기타 마지막
  } else {
    items.forEach(i => add("📂 " + normField(i), 0, i));
    map.forEach(g => g.order = -g.items.length); // 공고 많은 분야 먼저
  }
  return [...map.values()].sort((a, b) => a.order - b.order);
}

// ── URL 파라미터로 뷰 상태 복원/공유 (?src=&region=&g=&q=&date=&done=) ──
(function initFromURL() {

    document.querySelectorAll(".gtab").forEach(x =>
      x.classList.toggle("on", x.dataset.g === groupMode));
  }
  if (p.get("region")) {
    regionFilter = p.get("region");
    document.getElementById("regionSel").value = regionFilter;
  }
  if (p.get("sub")) subRegion = p.get("sub");
  if (p.get("q")) {
    document.getElementById("q").value = p.get("q");
    query = p.get("q").trim().toLowerCase();
  }
  if (p.get("date")) {
    selDate = p.get("date");
    if (/^\d{4}-\d{2}/.test(selDate)) {
      calY = +selDate.slice(0, 4); calM = +selDate.slice(5, 7) - 1;
    }
  }
  if (p.get("done") === "1") {
    hideDone = false;
    document.getElementById("hideDone").checked = false;
  }
})();
render();
</script>
</body>
</html>
